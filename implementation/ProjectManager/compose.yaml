services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U taskmanager -d taskmanager" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: